name: build-27menu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      OO_PS4_TOOLCHAIN: /home/runner/oo
      GOLDHEN_SDK: /home/runner/ghsdk
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain host
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm git make

      - name: OpenOrbis
        run: |
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$OO_PS4_TOOLCHAIN"
          test -x "$OO_PS4_TOOLCHAIN/bin/linux/create-fself"

      - name: GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$GOLDHEN_SDK"
          make -C "$GOLDHEN_SDK"

      - name: Compila
        run: make

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 27Menu-prx
          path: out/27Menu.prx
