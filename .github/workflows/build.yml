name: build-27menu

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain host
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm git make

      - name: OpenOrbis
        run: git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git "$HOME/oo"

      - name: GoldHEN SDK
        run: |
          git clone --depth 1 https://github.com/GoldHEN/GoldHEN_Plugins_SDK.git "$HOME/ghsdk"
          make -C "$HOME/ghsdk"

      - name: Compila
        run: |
          export OO_PS4_TOOLCHAIN="$HOME/oo"
          export GOLDHEN_SDK="$HOME/ghsdk"
          make

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 27Menu-prx
          path: out/27Menu.prx
